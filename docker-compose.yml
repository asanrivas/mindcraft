services:
  redis:
    image: redis:7-alpine
    container_name: redis-mem0
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - mindcraft-network

  text-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: gte-small-tei
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "31234:80"
    volumes:
      - huggingface-data:/data
    command: --model-id Xenova/gte-small
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mindcraft-network
    depends_on:
      redis:
        condition: service_healthy

  mindcraft:
    build: .
    container_name: mindcraft
    restart: unless-stopped
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false}
      REDIS_URL: redis://redis:6379
      MINDSERVER_PORT: 8080
      MINDSERVER_HOST_PUBLIC: "true"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000-3005:3000-3005" # see the view from the camera mounted on your bot head: http://localhost:3000/
      - "8080:8080" # Mindserver port
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      text-embeddings:
        condition: service_healthy
    networks:
      - mindcraft-network
    tty: true
    stdin_open: true

  viaproxy: #use this service to connect to an unsupported minecraft server versions. more info: ./services/viaproxy/README.md
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true

  # NOTE: mem0/Letta run separately at ~/letta (docker compose up -d)
  # - Letta server: http://localhost:8283
  # - LiteLLM proxy: http://localhost:4000

volumes:
  redis-data:
    name: redis-mem0-data
  huggingface-data:
    name: huggingfacetei

networks:
  mindcraft-network:
    name: mindcraft-network
    driver: bridge
