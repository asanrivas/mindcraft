version: '3.8'

services:
  app:
    build: .
    working_dir: /app
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - /app/node_modules
      - /tmp/.X11-unix:/tmp/.X11-unix
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY=:99
      - GALLIUM_DRIVER=softpipe
      - LIBGL_ALWAYS_SOFTWARE=1
      - MESA_GL_VERSION_OVERRIDE=3.3
    command: >
      sh -c "pkill -f 'Xvfb :99' || true &&
             rm -f /tmp/.X99-lock &&
             Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset & 
             sleep 2 && 
             node --max-old-space-size=4096 --no-warnings --trace-uncaught main.js"

