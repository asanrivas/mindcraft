<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindcraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#1a1a1a',
                        card: '#2d2d2d',
                        'card-hover': '#363636',
                        border: '#3a3a3a',
                        input: '#262626',
                        primary: '#4CAF50',
                        destructive: '#f44336',
                        muted: '#505050',
                        'muted-foreground': '#aaa',
                        foreground: '#e0e0e0',
                        accent: '#2196F3'
                    }
                }
            }
        }
    </script>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- Three.js for better 3D visualization -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <!-- Page Header -->
    <div class="page-header">
        <div class="page-title-row">
            <div class="page-title-left">
                <h1 class="page-title responsive-title">Mindcraft</h1>
                <span id="msStatus" class="badge badge-offline">MindServer offline</span>
            </div>
            <div class="page-controls">
                <button id="openCreateAgentBtn" class="btn btn-accent btn-sm">New Agent</button>
                <button class="btn btn-destructive btn-sm" onclick="window.disconnectAllAgents()">Disconnect All</button>
                <button class="btn btn-destructive btn-sm" onclick="window.confirmShutdown()">Shutdown</button>
            </div>
        </div>
    </div>

    <!-- Agents Grid -->
    <div id="agents" class="agents-grid">
        <!-- Agent cards will be rendered here -->
    </div>


    <!-- Create Agent Modal -->
    <div id="createAgentModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Create Agent</h2>
                <button id="closeCreateAgentBtn" class="btn btn-destructive btn-sm">Close</button>
            </div>
            <div class="modal-body">
                <div id="createAgentSection">
                    <div id="profileStatus" style="margin:8px 0; font-weight: 500;">Profile: Not uploaded</div>
                    <div id="settingsForm" class="settings-form"></div>
                    <div id="createError" style="color:var(--color-destructive);margin-top:12px;"></div>
                    <input type="file" id="profileFileInput" accept=".json,application/json" style="display:none">
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-left" id="footerStatus">
                    Configure settings, then upload a profile and create the agent.
                </div>
                <div class="modal-footer-actions">
                    <button id="uploadProfileBtn" class="btn btn-accent btn-md">Upload Profile</button>
                    <button id="submitCreateAgentBtn" class="btn btn-accent btn-md" disabled>Create Agent</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Agent Settings Modal -->
    <div id="agentSettingsModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 id="agentSettingsTitle" class="modal-title">Agent Settings</h2>
                <button id="closeAgentSettingsBtn" class="btn btn-destructive btn-sm">Close</button>
            </div>
            <div class="modal-body">
                <div id="agentSettingsSection">
                    <div id="agentSettingsForm" class="settings-form"></div>
                    <div id="agentSettingsError" style="color:var(--color-destructive);margin-top:12px;"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-left" id="agentSettingsFooter">
                    Modify settings then apply to restart the agent.
                </div>
                <div class="modal-footer-actions">
                    <button id="discardAgentSettingsBtn" class="btn btn-muted btn-md">Discard Changes</button>
                    <button id="applyAgentSettingsBtn" class="btn btn-accent btn-md" disabled>Apply & Restart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/three-map.js"></script>
    <script src="js/components.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/state-manager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
